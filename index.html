8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/shopping_cart/{section}<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/shopping-cart/update-a-shopping-cart-section\">Update a shopping cart section<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Changes the fields you send in one section and returns that section.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #f1edfe; color: #6941c6;\">PATCH<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/shopping_cart/{section}<\/code><\/td><\/tr><\/tbody><\/table>\n\n<h3 style=\"margin: 24px 0 8px;\">Checkout page<\/h3>\n\n<p style=\"margin: 0 0 16px;\">Use these endpoints to read the checkout page's billing and shipping address forms (the <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">billing_address<\/code> and <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">shipping_address<\/code> sections), and to change its sign-in, delivery, order summary and other settings (the <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">customer_checkout<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">delivery_options<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">order_summary<\/code> and <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">others<\/code> sections). For more detail, see the <a href=\"https://newlify.mintlify.app/checkout-page\">Checkout page overview<\/a>.<\/p>\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 0 0 20px; border: 1px solid #dfe3eb;\"><thead><tr><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Endpoint<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Method<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Path<\/th><\/tr><\/thead><tbody><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/checkout-page/get-checkout-page-settings\">Get checkout page settings<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns all six checkout page settings sections, and a group_meta block describing each one.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/checkout_page<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/checkout-page/update-checkout-page-settings\">Update checkout page settings<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Changes the fields you send in one or more sections and returns all settings.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #f1edfe; color: #6941c6;\">PATCH<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/checkout_page<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/checkout-page/get-checkout-page-settings-headers\">Get checkout page settings headers<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns the headers for the checkout page settings, with no body.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #eef0f3; color: #44546a;\">HEAD<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/checkout_page<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/checkout-page/get-a-settings-section\">Get a settings section<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns one settings section under its own key, such as order_summary.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/checkout_page/{section}<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/checkout-page/update-a-settings-section\">Update a settings section<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Changes the fields you send in one section and returns that section.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #f1edfe; color: #6941c6;\">PATCH<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/checkout_page/{section}<\/code><\/td><\/tr><\/tbody><\/table>\n\n<h2 style=\"margin: 32px 0 12px;\">Good to know<\/h2>\n\n<div style=\"background-color: #fdf8ee; border-left: 3px solid #c98a00; padding: 12px 16px; margin: 0 0 20px;\">\n  <p style=\"font-weight: 700; margin: 0 0 4px;\">Wrap every write in the right key<\/p>\n  <p style=\"margin: 0;\">On a whole page's path, such as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">/category_page<\/code>, wrap the fields in the page's key and then the section name: <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">{\"category_page\": {\"category_information\": {...}}}<\/code>. On a section's path, such as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">/category_page/category_information<\/code>, wrap them in the section's own name: <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">{\"category_information\": {...}}<\/code>. On the category page, shopping cart and checkout page, a section write wrapped in the page's key, or not wrapped at all, is rejected with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">400 invalid_request<\/code>. Promotion bodies are wrapped in <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">product_promotion<\/code>.<\/p>\n<\/div>\n\n<div style=\"background-color: #fdf8ee; border-left: 3px solid #c98a00; padding: 12px 16px; margin: 0 0 20px;\">\n  <p style=\"font-weight: 700; margin: 0 0 4px;\">After a rejected call, the next call can go wrong too<\/p>\n  <p style=\"margin: 0;\">On the checkout page, the call after a <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">400<\/code> on the same client gets the previous call's response instead of its own, and a write in it is not saved. On the shopping cart, the write after a rejected write on the same client returns the same rejection again, even when it is correct. In both cases, the call after that works normally. On the checkout page, make your next call from a new client after a <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">400<\/code>.<\/p>\n<\/div>\n\n<div style=\"background-color: #f0f6fb; border-left: 3px solid #2f7ebc; padding: 12px 16px; margin: 0 0 20px;\">\n  <p style=\"font-weight: 700; margin: 0 0 4px;\">Ask for a description of every field<\/p>\n  <p style=\"margin: 0;\">Add <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">field_metadata=true<\/code> to any settings read to also get a description of every field. The settings are still returned with it. On the product page it shows which fields depend on another in <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">depends_on<\/code>. On the checkout page's <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">customer_checkout<\/code> and <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">delivery_options<\/code> sections, it lists the rules a write must follow in <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">_rules<\/code>.<\/p>\n<\/div>\n\n<ul style=\"margin: 0 0 16px; padding-left: 24px;\">\n  <li style=\"margin: 0 0 6px;\"><strong>Send only the fields you change.<\/strong> <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">PATCH<\/code> is the only way to change settings, and fields you leave out keep their stored values. On the product page, sending a section back exactly as you read it can be rejected with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">400<\/code> and the code <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">constraint_violation<\/code>, because a field cannot be set to <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">true<\/code> while a field it depends on is off.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>Product page and search result page sections come back inside the page's key.<\/strong> Reading the product page's <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">quick_view<\/code> section returns <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">{\"product_page\": {\"quick_view\": {...}}}<\/code>, not <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">{\"quick_view\": {...}}<\/code>. The category page, shopping cart and checkout page return a section under its own name.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>Some checkout settings are read-only or cannot all be off.<\/strong> The <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">billing_address<\/code> and <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">shipping_address<\/code> sections are read-only. In <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">customer_checkout<\/code>, at least one of <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">allow_sign_in<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">allow_sign_up<\/code> and <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">checkout_as_guest<\/code> must stay on, and in <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">delivery_options<\/code>, at least one of the four delivery options must stay on. A write that breaks this is rejected with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">400<\/code> and the code <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">constraint_violation<\/code>.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>On the search result page, only <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">product_information<\/code> can be changed.<\/strong> A write to <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">seo<\/code> or <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">reinitialise<\/code> is rejected with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">400<\/code>. The promotions are not in the settings: use <a href=\"https://newlify.mintlify.app/api-reference/search-result-page/list-product-promotions\">List product promotions<\/a>. It ignores <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">limit<\/code>, so send <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">offset<\/code> to skip promotions. The store holds a limited number of promotions, which the listing gives as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">max_items<\/code> when you add <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">field_metadata=true<\/code>, so delete promotions you no longer need.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>Writes are rate limited.<\/strong> Writes to a page and to all its sections share one limit. Once it is used up, the next write is rejected with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">429<\/code> and a <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">Retry-After<\/code> header, and writes to the page and its sections are rejected until that time has passed, so wait before you write again. On the category page, product page, shopping cart and checkout page, the limit is ten writes in a short time, and on the checkout page it also blocks writes to the product page settings. Promotion writes have their own limit. The product page and checkout page also limit reads: the twenty-first read in about one and a half seconds on the product page, or in about one second on the checkout page, is rejected with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">429<\/code>.<\/li>\n<\/ul>\n\n<h2 style=\"margin: 32px 0 12px;\">Related articles<\/h2>\n\n<ul style=\"margin: 0 0 16px; padding-left: 24px;\">\n  <li style=\"margin: 0 0 6px;\">Getting started with the WebCommander API<\/li>\n  <li style=\"margin: 0 0 6px;\">Installing the WebCommander SDKs<\/li>\n<\/ul>\n", "size": 59679}, {"file": "05-store-settings.html", "title": "Working with store settings through the API", "subtitle": "Read and change a store's details, stock and pricing rules, customer portal, search, SEO and shipping settings", "summary": "Common store settings tasks, all fifty-four endpoints across nine areas, and what to watch for.", "html": "<p style=\"margin: 0 0 16px;\">The store settings endpoints let your software read and change how a store is set up: its details, logo and email settings, stock and pricing rules, customer portal, price display, product listings, search, SEO, shipping defaults and animation effects. All fifty-four endpoints are available in every WebCommander SDK.<\/p>\n\n<p style=\"margin: 0 0 16px;\">The settings are split into nine areas, and each has its own reference: <a href=\"https://newlify.mintlify.app/site-settings\">Site settings<\/a>, <a href=\"https://newlify.mintlify.app/ecommerce-settings\">Ecommerce settings<\/a>, <a href=\"https://newlify.mintlify.app/customer-portal\">Customer portal<\/a>, <a href=\"https://newlify.mintlify.app/price-display-settings\">Price display settings<\/a>, <a href=\"https://newlify.mintlify.app/product-listing\">Product listing<\/a>, <a href=\"https://newlify.mintlify.app/search-settings\">Search settings<\/a>, <a href=\"https://newlify.mintlify.app/seo-configuration\">SEO configuration<\/a>, <a href=\"https://newlify.mintlify.app/shipping-settings\">Shipping settings<\/a> and <a href=\"https://newlify.mintlify.app/animation-effects\">Animation effects<\/a>.<\/p>\n\n<p style=\"margin: 0 0 24px;\"><a href=\"https://newlify.mintlify.app/site-settings\" style=\"font-weight: 700;\">Open the Site settings reference<\/a><\/p>\n\n<h2 style=\"margin: 32px 0 12px;\">Common tasks<\/h2>\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 0 0 20px; border: 1px solid #dfe3eb;\">\n  <thead>\n    <tr>\n      <th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">You want to<\/th>\n      <th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Use<\/th>\n    <\/tr>\n  <\/thead>\n  <tbody>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Change the store's business name, address, contact email or ABN<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/site-settings/update-a-settings-section\">Update a settings section<\/a> in Site settings, with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">section<\/code> set to <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">store_details<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Set a minimum purchase amount or payment terms<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/ecommerce-settings/update-a-settings-section\">Update a settings section<\/a> in Ecommerce settings, with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">section<\/code> set to <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">pricing<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Open or close customer registration, or turn customer login on or off<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/customer-portal/update-a-customer-portal-section\">Update a customer portal section<\/a>, with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">section<\/code> set to <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">registration<\/code> or <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">login<\/code>, and <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">enabled<\/code> set to <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">true<\/code> or <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">false<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Show each line item's price with tax included<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/price-display-settings/update-a-settings-section\">Update a settings section<\/a> in Price display settings, with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">section<\/code> set to <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">order_item<\/code>, turning on <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">price_including_tax<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Change how many products a listing page shows, or how it is sorted<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/product-listing/update-product-listing-settings\">Update product listing settings<\/a><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Make a search for one word also find another, such as phone and mobile<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/search-settings/update-a-search-settings-section\">Update a search settings section<\/a>, with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">section<\/code> set to <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">synonyms<\/code>, then <a href=\"https://newlify.mintlify.app/api-reference/search-settings/get-the-reindex-status\">Get the reindex status<\/a> to see when the reindex has finished<\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Send visitors from an old URL to a new one<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/seo-configuration/create-a-redirect\">Create a redirect<\/a>. It returns the redirect's <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">id<\/code>, which the other redirect calls take as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">redirect_id<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Add a site verification file or <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">ads.txt<\/code><\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/seo-configuration/upload-a-document-root-file\">Upload a document root file<\/a><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Choose the store's default shipping profile<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/shipping-settings/update-shipping-settings\">Update shipping settings<\/a>, with the shipping profile's <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">id<\/code> in <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">default_shipping_profile<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">See which values a setting accepts before you change it<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Add <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">field_metadata=true<\/code> when you read an area or one of its sections, such as with <a href=\"https://newlify.mintlify.app/api-reference/ecommerce-settings/get-ecommerce-settings\">Get ecommerce settings<\/a>. The response then also describes each field<\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n\n<h2 style=\"margin: 32px 0 12px;\">All endpoints<\/h2>\n\n<h3 style=\"margin: 24px 0 8px;\">Site settings<\/h3>\n\n<p style=\"margin: 0 0 16px;\">Read and change your store's details, logo, favicon, brand colours, date and time formats, units of measure, CAPTCHA, and domain and email settings. See the <a href=\"https://newlify.mintlify.app/site-settings\">Site settings reference<\/a>.<\/p>\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 0 0 20px; border: 1px solid #dfe3eb;\"><thead><tr><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Endpoint<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Method<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Path<\/th><\/tr><\/thead><tbody><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/site-settings/get-site-settings\">Get site settings<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns all eight settings sections and a group_meta block describing each one.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/site_settings<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/site-settings/update-site-settings\">Update site settings<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Changes the fields you send in one or more sections and returns all settings.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #f1edfe; color: #6941c6;\">PATCH<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/site_settings<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/site-settings/get-site-settings-headers\">Get site settings headers<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns the headers for the site settings, with no body.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #eef0f3; color: #44546a;\">HEAD<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/site_settings<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/site-settings/get-a-settings-section\">Get a settings section<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns one settings section under its own key, such as brand_kit.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/site_settings/{section}<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/site-settings/update-a-settings-section\">Update a settings section<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Changes the fields you send in one section and returns that section.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #f1edfe; color: #6941c6;\">PATCH<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/site_settings/{section}<\/code><\/td><\/tr><\/tbody><\/table>\n\n<h3 style=\"margin: 24px 0 8px;\">Ecommerce settings<\/h3>\n\n<p style=\"margin: 0 0 16px;\">Read and change where the continue shopping link leads, how the store handles stock, minimum purchase amounts and payment terms, product restriction, the status each admin order list opens on, and whether the store uses more than one stock location. See the <a href=\"https://newlify.mintlify.app/ecommerce-settings\">Ecommerce settings reference<\/a>.<\/p>\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 0 0 20px; border: 1px solid #dfe3eb;\"><thead><tr><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Endpoint<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Method<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Path<\/th><\/tr><\/thead><tbody><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/ecommerce-settings/get-ecommerce-settings\">Get ecommerce settings<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns all six settings sections and the store's order flags, with a group_meta entry for each.<\/span><\/td><td style=\"padding:
