rder: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/country_taxes/{country_tax_id}<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/country-taxes/update-a-country-tax\">Update a country tax<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Changes only the fields you send and returns the updated country tax.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #fdf1e3; color: #a35200;\">PUT<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/country_taxes/{country_tax_id}<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/country-taxes/delete-a-country-tax\">Delete a country tax<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Deletes a country tax permanently and returns 204 with no body.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #fde9e7; color: #b42318;\">DELETE<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/country_taxes/{country_tax_id}<\/code><\/td><\/tr><\/tbody><\/table>\n\n<h3 style=\"margin: 24px 0 8px;\">Tax settings<\/h3>\n\n<p style=\"margin: 0 0 16px;\">Read and change the store's tax settings, such as the default country, the default tax code and the tax message. See the <a href=\"https://newlify.mintlify.app/tax-settings\">Tax settings overview<\/a>.<\/p>\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 0 0 20px; border: 1px solid #dfe3eb;\"><thead><tr><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Endpoint<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Method<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Path<\/th><\/tr><\/thead><tbody><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/tax-settings/get-tax-settings\">Get tax settings<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns all nine tax settings in one tax_settings object.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/settings<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/tax-settings/update-tax-settings\">Update tax settings<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Changes the tax settings you send inside settings and returns all nine.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #fdf1e3; color: #a35200;\">PUT<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/settings<\/code><\/td><\/tr><\/tbody><\/table>\n\n<h2 style=\"margin: 32px 0 12px;\">Good to know<\/h2>\n\n<div style=\"background-color: #fdf8ee; border-left: 3px solid #c98a00; padding: 12px 16px; margin: 0 0 20px;\">\n  <p style=\"font-weight: 700; margin: 0 0 4px;\">Some updates reset the fields you leave out<\/p>\n  <p style=\"margin: 0;\">Updates to tax profiles, tax rules, country taxes and tax settings change only the fields you send. Three others do not. An update to a tax code sets <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">priority<\/code> to <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">0<\/code> and <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">resolver_type<\/code> to <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">flat<\/code> if you leave them out. Replacing a custom tax profile sets <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">description<\/code> to <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">null<\/code> if you leave it out. An update to a tax zone empties <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">countries<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">states<\/code> and <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">post_code<\/code> if you leave them out, and sets <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">use_radius<\/code> to <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">false<\/code> if you leave it out. Custom tax profile and tax zone updates also need <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">name<\/code> every time. For these three, send the current values of every field you want to keep.<\/p>\n<\/div>\n\n<div style=\"background-color: #fdf8ee; border-left: 3px solid #c98a00; padding: 12px 16px; margin: 0 0 20px;\">\n  <p style=\"font-weight: 700; margin: 0 0 4px;\">A failed request can make the next request fail too<\/p>\n  <p style=\"margin: 0;\">When a tax request is rejected, the next request on the same connection can fail in the same way, even if it is correct. After a <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">404<\/code>, the next request for one record can return <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">404<\/code> for a record that exists, even in another part of Tax, and a delete returns that <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">404<\/code> and deletes nothing. After a list is rejected for its <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">limit<\/code> or <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">offset<\/code>, the next list returns the same <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">400<\/code>. The request after that works normally. If a call fails straight after another failed call, send it again, and read the record back to confirm a change or a delete.<\/p>\n<\/div>\n\n<div style=\"background-color: #f0f6fb; border-left: 3px solid #2f7ebc; padding: 12px 16px; margin: 0 0 20px;\">\n  <p style=\"font-weight: 700; margin: 0 0 4px;\">Put each write inside the right key<\/p>\n  <p style=\"margin: 0;\">For every create and update, send the fields inside one key named after the record: <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">tax_code<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">tax_rule<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">tax_zone<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">tax_profile<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">custom_profile<\/code> or <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">country_tax<\/code>, for example <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">{\"tax_code\": {\"name\": \"LUXURY\", \"rate\": 15.0}}<\/code>. Tax settings are different: the read returns them under <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">tax_settings<\/code>, but an update takes them under <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">settings<\/code>. A body without the right key is rejected with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">400<\/code>.<\/p>\n<\/div>\n\n<ul style=\"margin: 0 0 16px; padding-left: 24px;\">\n  <li style=\"margin: 0 0 6px;\"><strong>Lists return up to 20 records at a time.<\/strong> A larger <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">limit<\/code> still returns 20. To get more, raise <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">offset<\/code> by the number of records each page returned until you reach <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">pagination.total<\/code>. <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">q<\/code> does not filter any tax list.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>The Check endpoints do not tell you whether a record exists.<\/strong> They return <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">200<\/code> even when no record has the id you pass as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">tax_code_id<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">tax_rule_id<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">tax_zone_id<\/code> or <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">tax_profile_id<\/code>. Use the matching Retrieve endpoint instead, which returns <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">404<\/code> when no record has that id.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>You cannot set a tax rule's tax code or zones.<\/strong> A create or update accepts <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">code<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">zones<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">decimal_point<\/code> and <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">rounding_type<\/code> but does not store them. A rule you create has <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">code: {}<\/code> and <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">zones: []<\/code>.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>Move the default tax profile rather than deleting it.<\/strong> At most one tax profile is the default. To change it, send <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">default: true<\/code> in <a href=\"https://newlify.mintlify.app/api-reference/tax-profiles/update-a-tax-profile\">Update a tax profile<\/a> for the new default. Sending <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">default: false<\/code> leaves the flag where it is. If you delete the default profile, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">default_tax_profile<\/code> in the tax settings still holds the deleted profile's <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">id<\/code>, and an update to the tax settings cannot send that value back.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>Send a tax zone's post codes as a flat list.<\/strong> Send <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">[\"2000\", \"3000\"]<\/code> in <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">post_code<\/code>. The zone returns them as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">[[\"2000\"], [\"3000\"]]<\/code>, and sending that nested form back fails with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">500<\/code>.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>Tax settings save some values without checking them.<\/strong> <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">default_country<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">default_tax_code<\/code> and <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">custom_tax_profile_id<\/code> (a custom tax profile's <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">id<\/code>) are saved even when they match nothing, so check them before you send them.<\/li>\n<\/ul>\n\n<h2 style=\"margin: 32px 0 12px;\">Related articles<\/h2>\n\n<ul style=\"margin: 0 0 16px; padding-left: 24px;\">\n  <li style=\"margin: 0 0 6px;\">Getting started with the WebCommander API<\/li>\n  <li style=\"margin: 0 0 6px;\">Installing the WebCommander SDKs<\/li>\n<\/ul>\n", "size": 70998}, {"file": "08-inventory-and-orders.html", "title": "Working with inventory locations and order flags through the API", "subtitle": "Manage inventory locations, choose the default location, see the stock each one holds, and manage the store's order flags", "summary": "Common inventory location and order flag tasks, all seventeen endpoints, and what to watch for.", "html": "<p style=\"margin: 0 0 16px;\">The Inventory locations and Order flags APIs let your software work with a store's inventory locations and order flags. You can list, create, replace and delete locations, activate or deactivate them, choose the default location and see the products each one holds. You can also list, create, read, replace and delete the store's order flags. All seventeen endpoints are available in all seven WebCommander SDKs.<\/p>\n\n<p style=\"margin: 0 0 24px;\"><a href=\"https://newlify.mintlify.app/inventory-locations\" style=\"font-weight: 700;\">Open the Inventory locations reference<\/a>&nbsp;&nbsp;&nbsp;&nbsp;<a href=\"https://newlify.mintlify.app/order-flags\" style=\"font-weight: 700;\">Open the Order flags reference<\/a><\/p>\n\n<h2 style=\"margin: 32px 0 12px;\">Common tasks<\/h2>\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 0 0 20px; border: 1px solid #dfe3eb;\">\n  <thead>\n    <tr>\n      <th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">You want to<\/th>\n      <th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Use<\/th>\n    <\/tr>\n  <\/thead>\n  <tbody>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Add a new location, such as a warehouse<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/inventory-locations/create-an-inventory-location\">Create an inventory location<\/a> with a <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">name<\/code> and <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">\"is_active\": true<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">See which products a location holds, and how many of each<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/inventory-locations/list-stock-at-an-inventory-location\">List stock at an inventory location<\/a>, page by page<\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Change which location is the default<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/inventory-locations/set-the-default-inventory-location\">Set the default inventory location<\/a>. The location you name also becomes active<\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Activate or deactivate a location without changing anything else about it<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/inventory-locations/activate-or-deactivate-an-inventory-location\">Activate or deactivate an inventory location<\/a><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Add an order flag, such as \"Awaiting Stock\"<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/order-flags/create-an-order-flag\">Create an order flag<\/a> with a <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">name<\/code> and a <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">color<\/code> written as a hex code, such as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">#5A7BD4<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Change an order flag's colour or description<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/order-flags/retrieve-an-order-flag\">Retrieve an order flag<\/a>, then <a href=\"https://newlify.mintlify.app/api-reference/order-flags/replace-an-order-flag\">Replace an order flag<\/a> with every field you want to keep<\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n\n<h2 style=\"margin: 32px 0 12px;\">All endpoints<\/h2>\n\n<h3 style=\"margin: 24px 0 8px;\">Inventory locations<\/h3>\n\n<p style=\"margin: 0 0 16px;\">These endpoints list, create, replace and delete the store's inventory locations, activate or deactivate them, show the products each one holds, and choose the default location. The <a href=\"https://newlify.mintlify.app/inventory-locations\">Inventory locations overview<\/a> explains each one.<\/p>\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 0 0 20px; border: 1px solid #dfe3eb;\"><thead><tr><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Endpoint<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Method<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Path<\/th><\/tr><\/thead><tbody><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/inventory-locations/list-inventory-locations\">List inventory locations<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns up to 20 inventory locations per call, default location first, with paging details.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/inventory_locations<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/inventory-locations/check-the-inventory-locations-list\">Check the inventory locations list<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Checks that the inventory locations list is reachable. Returns headers only, with no body.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #eef0f3; color: #44546a;\">HEAD<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/inventory_locations<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/inventory-locations/create-an-inventory-location\">Create an inventory location<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Creates an inventory location and returns it with its id, which other calls take as inventory_location_id.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e8f0fe; color: #1c5fd0;\">POST<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/inventory_locations<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/inventory-locations/retrieve-an-inventory-location\">Retrieve an inventory location<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns the inventory location whose id you pass as inventory_location_id.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/inventory_locations/{inventory_location_id}<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/inventory-locations/check-an-inventory-location\">Check an inventory location<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns headers only, with no body, for the location you pass as inventory_location_id.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #eef0f3; color: #44546a;\">HEAD<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/inventory_locations/{inventory_location_id}<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/inventory-locations/replace-an-inventory-location\">Replace an inventory location<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Replaces the location's name, address, is_active and is_default with your body and returns it.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #fdf1e3; color: #a35200;\">PUT<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/inventory_locations/{inventory_location_id}<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/inventory-locations/delete-an-inventory-location\">Delete an inventory location<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Deletes an inventory location permanently. You cannot delete the default location.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #fde9e7; color: #b42318;\">DELETE<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/inventory_locations/{inventory_location_id}<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/inventory-locations/list-stock-at-an-inventory-location\">List stock at an inventory location<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns an inventory location and up to 20 of the products it holds, with paging details.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/inventory_locations/{inventory_location_id}/stock<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/inventory-locations/set-the-default-inventory-location\">Set the default inventory location<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Makes an inventory location the default and removes the flag from the previous one.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #fdf1e3; color: #a35200;\">PUT<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/inventory_locations/{inventory_location_id}/default<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/inventory-locations/activate-or-deactivate-an-inventory-location\">Activate or deactivate an inventory location<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Sets is_active on an inventory location and leaves every other field as it is.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #fdf1e3; color: #a35200;\">PUT<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/inventory_locations/{inventory_location_id}/status<\/code><\/td><\/tr><\/tbody><\/table>\n\n<h3 style=\"margin: 24px 0 8px;\">Order flags<\/h3>\n\n<p style=\"margin: 0 0 16px;\">These endpoints list, create, read, replace and delete the store's order flags. Each flag has a name, a colour and an optional description. The <a href=\"https://newlify.mintlify.app/order-flags\">Order flags overview<\/a> explains each one.<\/p>\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 0 0 20px; border: 1px solid #dfe3eb;\"><thead><tr><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Endpoint<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Method<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Path<\/th><\/tr><\/thead><tbody><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/order-flags/list-order-flags\">List order flags<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns up to 20 order flags per call, sorted by name, with paging details.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/order_flags<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/order-flags/check-the-order-flags-list\">Check the order flags list<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Checks that the order flags list is reachable. Returns headers only, with no body.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #eef0f3; color: #44546a;\">HEAD<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/order_flags<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/order-flags/create-an-order-flag\">Create an order flag<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Creates an order flag and returns it with its id, which other calls take as order_flag_id.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e8f0fe; color: #1c5fd0;\">POST<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/order_flags<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/order-flags/retrieve-an-order-flag\">Retrieve an order flag<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns the order flag whose id you pass as order_flag_id.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/order_flags/{order_flag_id}<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/order-flags/check-an-order-flag\">Check an order flag<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns headers only, with no body, for the order flag you pass as order_flag_id.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #eef0f3; color: #44546a;\">HEAD<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/order_flags/{order_flag_id}<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/order-flags/replace-an-order-flag\">Replace an order flag<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Replaces an order flag's name, color and description and returns the updated flag.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #fdf1e3; color: #a35200;\">PUT<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/order_flags/{order_flag_id}<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/order-flags/delete-an-order-flag\">Delete an order flag<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Permanently deletes the order flag whose id you pass as order_flag_id. Returns no body.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #fde9e7; color: #b42318;\">DELETE<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/order_flags/{order_flag_id}<\/code><\/td><\/tr><\/tbody><\/table>\n\n<h2 style=\"margin: 32px 0 12px;\">Good to know<\/h2>\n\n<div style=\"background-color: #fdf8ee; border-left: 3px solid #c98a00; padding: 12px 16px; margin: 0 0 20px;\">\n  <p style=\"font-weight: 700; margin: 0 0 4px;\">A replace resets every field you leave out<\/p>\n  <p style=\"margin: 0;\">Replacing a location or an order flag does not merge your changes with what is already there. On a location, a field you leave out is reset: <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">address<\/code> becomes <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">\"\"<\/code>, and <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">is_active<\/code> and <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">is_default<\/code> become <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">false<\/code>. If you replace the default location without <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">is_default<\/code>, the store has no default location until you set one again with <a href=\"https://newlify.mintlify.app/api-reference/inventory-locations/set-the-default-inventory-location\">Set the default inventory location<\/a>. On an order flag, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">name<\/code> and <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">color<\/code> are required every time, and a <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">description<\/code> you leave out becomes <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">null<\/code>. Always send every field you want to keep.<\/p>\n<\/div>\n\n<div style=\"background-color: #f0f6fb; border-left: 3px solid #2f7ebc; padding: 12px 16px; margin: 0 0 20px;\">\n  <p style=\"font-weight: 700; margin: 0 0 4px;\">Order flag fields go inside order_flag, location fields do not<\/p>\n  <p style=\"margin: 0;\">When you create or replace an order flag, put its fields inside <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">order_flag<\/code>, for example <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">{\"order_flag\": {\"name\": \"Awaiting Stock\", \"color\": \"#5A7BD4\"}}<\/code>. Without <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">order_flag<\/code>, the call is rejected with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">400<\/code> and the message <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">order_flag missing<\/code>. Inventory locations are the opposite: send <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">name<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">address<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">is_active<\/code> and <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">is_default<\/code> at the top level of the body. A create with the fields inside <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">inventory_location<\/code> is rejected with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">400<\/code> and the message <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">name is required<\/code>.<\/p>\n<\/div>\n\n<ul style=\"margin: 0 0 16px; padding-left: 24px;\">\n  <li style=\"margin: 0 0 6px;\"><strong>New locations start inactive.<\/strong> A new location has <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">is_active<\/code> set to <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">false<\/code> unless you send <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">true<\/code>.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>At most one location is the default, and you cannot delete the default location.<\/strong> Setting a new default, or creating a location with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">\"is_default\": true<\/code>, means the location that was the default stops being the default. To delete the default location, first make another location the default, or the delete is rejected with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">409<\/code>.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>Lists return up to 20 items at a time.<\/strong> This applies to locations, to the products at a location and to order flags, and a larger <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">limit<\/code> does not change it. To get more, send the next <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">page<\/code> or a higher <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">offset<\/code> while <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">pagination.has_next<\/code> is <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">true<\/code>.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>A <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">200<\/code> does not prove a location change was saved, and no call changes stock.<\/strong> If you use a method the location paths do not support, such as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">PATCH<\/code> on a location or any write to a location's stock, the store returns <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">200<\/code> with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">\"isSuccess\": false<\/code> and saves nothing. To change a location, use <a href=\"https://newlify.mintlify.app/api-reference/inventory-locations/replace-an-inventory-location\">Replace an inventory location<\/a>, or <a href=\"https://newlify.mintlify.app/api-reference/inventory-locations/activate-or-deactivate-an-inventory-location\">Activate or deactivate an inventory location<\/a> to change only <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">is_active<\/code>. The stock listing is read-only.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>A check does not tell you whether a location or order flag exists.<\/strong> <a href=\"https://newlify.mintlify.app/api-reference/inventory-locations/check-an-inventory-location\">Check an inventory location<\/a> and <a href=\"https://newlify.mintlify.app/api-reference/order-flags/check-an-order-flag\">Check an order flag<\/a> return <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">200<\/code> even when nothing has the id you send. To find out whether it exists, use <a href=\"https://newlify.mintlify.app/api-reference/inventory-locations/retrieve-an-inventory-location\">Retrieve an inventory location<\/a> with the location's <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">id<\/code> as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">inventory_location_id<\/code>, or <a href=\"https://newlify.mintlify.app/api-reference/order-flags/retrieve-an-order-flag\">Retrieve an order flag<\/a> with the flag's <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">id<\/code> as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">order_flag_id<\/code>. Both return <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">404<\/code> when nothing has that id.<\/li>\n<\/ul>\n\n<h2 style=\"margin: 32px 0 12px;\">Related articles<\/h2>\n\n<ul style=\"margin: 0 0 16px; padding-left: 24px;\">\n  <li style=\"margin: 0 0 6px;\">Getting started with the WebCommander API<\/li>\n  <li style=\"margin: 0 0 6px;\">Installing the WebCommander SDKs<\/li>\n<\/ul>\n", "size": 36863}, {"file": "09-domain-aliases.html", "title": "Working with domain aliases through the API", "subtitle": "List, add and delete the extra hostnames a store responds to", "summary": "Common domain alias tasks, all four endpoints, and what to watch for.", "html": "<p style=\"margin: 0 0 16px;\">The Domain aliases API lets your software manage a store's domain aliases: the extra hostnames, such as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">shop.example.com<\/code>, that the store responds to. You can list the aliases, add new ones and delete the ones you no longer need. All four endpoints are available in all seven WebCommander SDKs.<\/p>\n\n<p style=\"margin: 0 0 24px;\"><a href=\"https://newlify.mintlify.app/domain-aliases\" style=\"font-weight: 700;\">Open the Domain aliases reference<\/a><\/p>\n\n<h2 style=\"margin: 32px 0 12px;\">Common tasks<\/h2>\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 0 0 20px; border: 1px solid #dfe3eb;\">\n  <thead>\n    <tr>\n      <th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">You want to<\/th>\n      <th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Use<\/th>\n    <\/tr>\n  <\/thead>\n  <tbody>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">See the extra hostnames the store responds to<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/domain-aliases/list-domain-aliases\">List domain aliases<\/a>, page by page<\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Add a new hostname for the store<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/domain-aliases/create-a-domain-alias\">Create a domain alias<\/a> with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">{\"alias\": \"shop.example.com\"}<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Remove a hostname the store no longer uses<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/domain-aliases/list-domain-aliases\">List domain aliases<\/a> to find the alias's <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">id<\/code>, then <a href=\"https://newlify.mintlify.app/api-reference/domain-aliases/delete-a-domain-alias\">Delete a domain alias<\/a> with that <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">id<\/code> as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">alias_id<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Change an alias's hostname<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">You cannot update an alias. <a href=\"https://newlify.mintlify.app/api-reference/domain-aliases/delete-a-domain-alias\">Delete a domain alias<\/a>, then <a href=\"https://newlify.mintlify.app/api-reference/domain-aliases/create-a-domain-alias\">Create a domain alias<\/a> with the new hostname<\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Check that the aliases list is reachable, without downloading it<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/domain-aliases/check-the-domain-aliases-list\">Check the domain aliases list<\/a><\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n\n<h2 style=\"margin: 32px 0 12px;\">All endpoints<\/h2>\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 0 0 20px; border: 1px solid #dfe3eb;\"><thead><tr><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Endpoint<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Method<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Path<\/th><\/tr><\/thead><tbody><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/domain-aliases/list-domain-aliases\">List domain aliases<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns up to 20 domain aliases per call, with paging details.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/aliases<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/domain-aliases/check-the-domain-aliases-list\">Check the domain aliases list<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Checks that the domain aliases list is reachable. Returns headers only, with no body.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #eef0f3; color: #44546a;\">HEAD<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/aliases<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/domain-aliases/create-a-domain-alias\">Create a domain alias<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Adds a hostname as an alias. Returns the new alias, whose id delete takes as alias_id.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e8f0fe; color: #1c5fd0;\">POST<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/aliases<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://newlify.mintlify.app/api-reference/domain-aliases/delete-a-domain-alias\">Delete a domain alias<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Deletes the domain alias whose id you pass as alias_id. Returns 204 with no body.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #fde9e7; color: #b42318;\">DELETE<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/aliases/{alias_id}<\/code><\/td><\/tr><\/tbody><\/table>\n\n<h2 style=\"margin: 32px 0 12px;\">Good to know<\/h2>\n\n<div style=\"background-color: #fdf8ee; border-left: 3px solid #c98a00; padding: 12px 16px; margin: 0 0 20px;\">\n  <p style=\"font-weight: 700; margin: 0 0 4px;\">Send the hostname as a plain string<\/p>\n  <p style=\"margin: 0;\">The create body is <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">{\"alias\": \"shop.example.com\"}<\/code>. The create response returns the new alias as an object under the same <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">alias<\/code> key. Do not send that shape back: a body such as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">{\"alias\": {\"alias\": \"shop.example.com\"}}<\/code> is rejected with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">400 invalid_hostname<\/code>.<\/p>\n<\/div>\n\n<div style=\"background-color: #f0f6fb; border-left: 3px solid #2f7ebc; padding: 12px 16px; margin: 0 0 20px;\">\n  <p style=\"font-weight: 700; margin: 0 0 4px;\">You cannot read or change one alias on its own<\/p>\n  <p style=\"margin: 0;\">You can list, create and delete aliases. Reading or updating a single alias returns <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">405<\/code>, and an update changes nothing. To find one alias, page through <a href=\"https://newlify.mintlify.app/api-reference/domain-aliases/list-domain-aliases\">List domain aliases<\/a> and look for its hostname in <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">alias<\/code>. There is no call that counts aliases. To get the number of aliases, read <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">pagination.total<\/code> in the list response.<\/p>\n<\/div>\n\n<ul style=\"margin: 0 0 16px; padding-left: 24px;\">\n  <li style=\"margin: 0 0 6px;\"><strong>The list returns up to 20 aliases at a time.<\/strong> A larger <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">limit<\/code> is capped at <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">20<\/code>. To get more, send the next <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">page<\/code> number or a higher <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">offset<\/code> while <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">pagination.has_next<\/code> is <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">true<\/code>. You cannot search or sort the list: any parameter other than <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">limit<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">offset<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">page<\/code> and <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">field_metadata<\/code>, such as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">q<\/code> or <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">sort<\/code>, is rejected with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">400 unknown_parameter<\/code>.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>Each hostname can be added only once, whatever its letter case.<\/strong> If another alias already has the hostname, even in a different letter case, the create is rejected with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">409<\/code> and the message <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">alias already exists<\/code>. The store keeps the letter case you send.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>The hostname must be well formed.<\/strong> A hostname with a space in it, a scheme such as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">https://<\/code>, an underscore or a leading hyphen is rejected with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">400 invalid_hostname<\/code>. So is an <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">alias<\/code> that is a number or a list. Spaces before or after the hostname are removed.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>The site settings show the same hostnames.<\/strong> They appear under <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">domain_settings.aliases<\/code> as a read-only list. Creating an alias adds its hostname to that list, and deleting the alias removes it.<\/li>\n<\/ul>\n\n<h2 style=\"margin: 32px 0 12px;\">Related articles<\/h2>\n\n<ul style=\"margin: 0 0 16px; padding-left: 24px;\">\n  <li style=\"margin: 0 0 6px;\">Getting started with the WebCommander API<\/li>\n  <li style=\"margin: 0 0 6px;\">Installing the WebCommander SDKs<\/li>\n<\/ul>\n", "size": 16317}]}</script>
<script>
  const data = JSON.parse(document.getElementById('data').textContent);
  const copied = new Set(JSON.parse(sessionStorage.getItem('kb-copied') || '[]'));
  const logo = new URL('assets/webcommander-logo.svg', location.href).href;
  const COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  const TICK = '<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

  const entries = [{ kind: 'category', id: 'category', title: data.category.name, category: data.category }]
    .concat(data.articles.map(a => Object.assign({ kind: 'article', id: a.file }, a)));
  const buttons = [];
  let current = 1;

  document.getElementById('base').textContent = data.base;
  document.getElementById('placeholder').hidden = !data.placeholder;

  function escapeHtml(value) {
    return String(value).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  function listButton(entry, index) {
    const button = document.createElement('button');
    button.type = 'button';
    button.innerHTML = '<span><span class="name"></span><span class="kind"></span></span>' + TICK;
    button.querySelector('.name').textContent = entry.title;
    button.querySelector('.kind').textContent = entry.kind === 'category' ? 'Category page' : data.category.name;
    button.classList.toggle('copied', copied.has(entry.id));
    button.addEventListener('click', () => show(index));
    const item = document.createElement('li');
    item.appendChild(button);
    buttons[index] = button;
    return item;
  }

  entries.forEach((entry, index) => {
    document.getElementById(entry.kind === 'category' ? 'category-list' : 'articles').appendChild(listButton(entry, index));
  });

  function countLabel(shown) {
    const total = data.articles.length;
    return shown === total ? total + (total === 1 ? ' article' : ' articles') : shown + ' of ' + total + ' articles';
  }
  document.getElementById('count').textContent = countLabel(data.articles.length);

  const KB_CSS = `
    *{box-sizing:border-box}
    body{margin:0;font-family:"Open Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#333;background:#fff}
    a{color:#c75b17;text-decoration:none}
    a:hover{text-decoration:underline}
    .kb-top{display:flex;align-items:center;justify-content:space-between;padding:22px 32px}
    .kb-brand{display:flex;align-items:flex-end;gap:10px}
    .kb-brand img{height:34px}
    .kb-brand span{font-size:15px;color:#555;padding-bottom:2px}
    .kb-go{background:#ef7025;color:#fff;font-weight:600;font-size:15px;padding:10px 20px;border-radius:999px}
    .kb-go:hover{text-decoration:none;background:#c75b17}
    .kb-hero{background:#f2f2f2;padding:56px 32px 60px}
    .kb-hero-in{max-width:1000px;margin:0 auto}
    .kb-hero h2{margin:0 0 16px;font-size:34px;line-height:1.2;font-weight:700;color:#222}
    .kb-search{display:flex;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
    .kb-search input{flex:1;border:0;padding:12px 14px;font:inherit;font-size:15px;color:#333;outline:none}
    .kb-search span{width:40px;display:grid;place-items:center;background:#e6eaee;color:#333}
    .kb-wrap{max-width:1000px;margin:0 auto;padding:0 0 32px}
    .kb-crumbs{padding:16px 0 28px;font-size:15px}
    .kb-crumbs .sep{color:#555;margin:0 10px}
    .kb-cols{display:grid;grid-template-columns:240px minmax(0,1fr);gap:0}
    .kb-side{padding-right:24px;border-right:1px solid #e5e5e5}
    .kb-side a{display:block;padding:9px 10px;font-size:15px}
    .kb-side a.on{background:#fdefe6;color:#b8501a}
    .kb-side .sub a{padding:6px 10px 6px 22px;font-size:14px;color:#555}
    .kb-side .sub a.on{background:none;color:#b8501a;font-weight:600}
    .kb-main{padding:0 0 0 32px;min-width:0}
    .kb-main h1{margin:0 0 6px;font-size:32px;line-height:1.35;font-weight:700;color:#333}
    .kb-sub{margin:0 0 22px;font-size:15px;font-style:italic;color:#666}
    .kb-body h2{font-size:22px;line-height:1.35;font-weight:600;color:#333}
    .kb-body h3{font-size:18px;line-height:1.4;font-weight:600;color:#333}
    .kb-body ul,.kb-body ol{padding-left:26px}
    .kb-body table{font-size:15px}
    .kb-help{display:flex;align-items:center;gap:14px;margin:36px 0 0;padding:18px 0;border-top:1px solid #e5e5e5;border-bottom:1px solid #e5e5e5;font-size:15px}
    .kb-help span{display:inline-block;padding:5px 22px;background:#e6eaee;border-radius:3px;font-size:13px}
    .kb-list{list-style:none;margin:18px 0 0;padding:0 0 18px;border-bottom:1px solid #e5e5e5}
    .kb-list li{margin:0 0 10px}
